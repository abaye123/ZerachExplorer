name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from Directory.Build.props
        id: check
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists, skipping auto-release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected, triggering release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check-version.outputs.tag }}
