name: Release

# Publishes a release when the version in Directory.Build.props changes on main.
# The "release" environment holds the signing certificate and requires approval.

on:
  push:
    branches:
      - main
    paths:
      - Directory.Build.props
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version and tests
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $tag = "v$("$($props.Project.PropertyGroup.Version)".Trim())"
          $found = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not list tags." }
          if (-not (Test-Path "release-notes/$tag.md")) { throw "release-notes/$tag.md is missing." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$([bool]$found)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          dotnet build ZerachExplorer.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test ZerachExplorer.sln --configuration Release --no-build

  release:
    name: Build, sign & publish
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    env:
      THUMBPRINT: EBAE118B2C6434273890DE749EC457C34FE1A882

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }

      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP "signing.pfx"
          try {
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            Import-PfxCertificate $file -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          } finally {
            Remove-Item $file -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "Cert:\CurrentUser\My\$env:THUMBPRINT")) { throw "The imported certificate is not the expected one." }

      - name: Build and sign packages
        shell: pwsh
        run: ./scripts/build-release.ps1 -Thumbprint $env:THUMBPRINT

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey -Force -ErrorAction SilentlyContinue

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          gh release create $env:TAG $files --target $env:GITHUB_SHA --title "ZerachExplorer $env:TAG" --notes-file "release-notes/$env:TAG.md"
